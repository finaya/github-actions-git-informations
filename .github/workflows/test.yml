name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    name: Action sets the env vars
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./
      - name: Check RELEASE_VERSION and GITOPS_BRANCH
        run: |
          test "$RELEASE_VERSION" = "${GITHUB_SHA::7}"
          test "$GITOPS_BRANCH" = develop

  refs:
    name: Each ref maps to its GitOps branch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: sh tests/entrypoint.test.sh
